name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python source
        run: python -m compileall -q raspberry_pi llm_advisory pcb_engine_kit scripts tests

      - name: Check Python 3.13 ARM64 binary wheels for the Pi runtime
        run: |
          python -m pip download \
            --dest "$RUNNER_TEMP/pi5-py313-wheels" \
            --only-binary=:all: --no-deps \
            --platform manylinux_2_17_aarch64 \
            --platform manylinux_2_28_aarch64 \
            --implementation cp --python-version 3.13 \
            --abi cp313 --abi abi3 --abi none \
            numpy==2.2.6 opencv-python==4.11.0.86 \
            onnx==1.19.0 onnxruntime==1.21.1

      - name: Run repository contract suite
        run: python -m unittest discover -s tests -v

      - name: Test dataset utility contracts
        working-directory: pcb_engine_kit
        run: python -m unittest -v test_contracts.py
