# Example XNNPACK export for a Llama 3.2 1B Instruct checkpoint.
# Download the original files from Meta or an authorized Hugging Face source.
# These paths are examples; they must point to the actual licensed files.
base:
  model_class: llama3_2
  checkpoint: /absolute/path/to/consolidated.00.pth
  params: /absolute/path/to/params.json
  tokenizer_path: /absolute/path/to/tokenizer.model
  metadata: '{"get_bos_id":128000, "get_eos_ids":[128009, 128001]}'

model:
  dtype_override: fp32
  use_kv_cache: true
  use_sdpa_with_kv_cache: true

export:
  max_seq_length: 2048
  max_context_length: 2048
  output_name: pcb_llama3_2_1b_xnnpack.pte

quantization:
  qmode: 8da4w
  group_size: 32
  embedding_quantize: "8,0"

backend:
  xnnpack:
    enabled: true
    extended_ops: true
